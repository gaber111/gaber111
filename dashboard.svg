<g><animateTransform attributeName="transform" type="rotate" from="0 675 238" to="360 675 238" dur="26s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0 675 146" to="-360 675 146" dur="26s" repeatCount="indefinite"/><rect x="631.6" y="131" width="86.8" height="30" rx="15" fill="#0F1B3A" stroke="#00E5C3" stroke-width="1.6"/><text class="mono" x="675" y="151" font-size="14" fill="#EAF2FF" text-anchor="middle">Web Dev</text></g><g><animateTransform attributeName="transform" type="rotate" from="0 754.6743 284" to="-360 754.6743 284" dur="26s" repeatCount="indefinite"/><rect x="698.6743" y="269" width="112" height="30" rx="15" fill="#0F1B3A" stroke="#FFB547" stroke-width="1.6"/><text class="mono" x="754.6743" y="289" font-size="14" fill="#EAF2FF" text-anchor="middle">Interfaces</text></g><g><animateTransform attributeName="transform" type="rotate" from="0 595.3257 284" to="-360 595.3257 284" dur="26s" repeatCount="indefinite"/><rect x="547.7257" y="269" width="95.2" height="30" rx="15" fill="#0F1B3A" stroke="#58A6FF" stroke-width="1.6"/><text class="mono" x="595.3257" y="289" font-size="14" fill="#EAF2FF" text-anchor="middle">Insights</text></g></g>
