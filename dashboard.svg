  <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00E5C3" stop-opacity="0.22"/><stop offset="1" stop-color="#00E5C3" stop-opacity="0"/></radialGradient>
  <style>
    .mono{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:700}
    .dash{stroke-dasharray:6 8;animation:dm 14s linear infinite}
