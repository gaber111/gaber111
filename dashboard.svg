<text class="mono" x="42" y="324" font-size="14" fill="#00E5C3" opacity="0">$ build portfolio<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.09;0.1;0.82;0.86;1" values="0;0;1;1;0;0"/></text><text class="mono" x="42" y="348" font-size="14" fill="#35F2A5" opacity="0">[ok] design ready<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.22;0.23;0.82;0.86;1" values="0;0;1;1;0;0"/></text><text class="mono" x="42" y="372" font-size="14" fill="#35F2A5" opacity="0">[ok] pages compiled<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.35;0.36;0.82;0.86;1" values="0;0;1;1;0;0"/></text><text class="mono" x="42" y="396" font-size="14" fill="#35F2A5" opacity="0">[ok] deployed to GitHub<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.48;0.49;0.82;0.86;1" values="0;0;1;1;0;0"/></text>
<rect x="42" y="406" width="9" height="3" fill="#00E5C3"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>

<rect x="370" y="20" width="610" height="400" rx="16" fill="#0B1226" stroke="#16314a" stroke-width="1.5"/><text class="mono" x="392" y="52" font-size="15" fill="#00E5C3" letter-spacing="2">SKILL ORBIT</text><line x1="392" y1="64" x2="958" y2="64" stroke="#16314a" stroke-width="1"/>
