  </style>
</defs>
<rect width="1000" height="440" rx="20" fill="#070b1a"/>

<rect x="20" y="20" width="330" height="215" rx="16" fill="#0B1226" stroke="#16314a" stroke-width="1.5"/><text class="mono" x="42" y="52" font-size="15" fill="#00E5C3" letter-spacing="2">SYSTEM STATUS</text><line x1="42" y1="64" x2="328" y2="64" stroke="#16314a" stroke-width="1"/>
